name: dhanwiser_fixed
description: "Community Expense Sharing App"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  file_picker: ^8.1.2
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  animations: ^2.2.0
  share_plus: ^12.0.2
  app_links: ^7.2.1
  intl: ^0.20.3
  connectivity_plus: ^7.3.1
  fl_chart: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: IconlyLight
      fonts:
        - asset: assets/fonts/IconlyLight.ttf
    - family: IconlyBold
      fonts:
        - asset: assets/fonts/IconlyBold.ttf
    - family: IconlyBroken
      fonts:
        - asset: assets/fonts/IconlyBroken.ttf


